<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Simple Task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="row">
        <div class="col-md-6 bg-primary text-white p-3 text-center">
            Grid Column 1
        </div>
        <div class="col-md-6 bg-success text-white p-3 text-center">
            Grid Column 2
        </div>
    </div>

    <div class="alert alert-warning mt-4">
        This is a Bootstrap Alert
    </div>

    <button class="btn btn-danger mb-3">Click Me</button>

    <div class="card p-3 shadow">
        <h5 class="card-title">Bootstrap Card</h5>
        <p class="card-text">This card uses utility classes like padding and shadow.</p>
        <a href="#" class="btn btn-primary">Read More</a>
    </div>

</div>

</body>
</html>
