<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 3 – Buttons &amp; Alert</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
</head>
<body>

  <div class="container py-5">
    <h2 class="mb-4">Buttons &amp; Alerts</h2>

    <div class="alert alert-warning alert-dismissible fade show mb-4" role="alert">
      <strong>Heads up!</strong> This is an important notice. Please read it carefully.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>


    <h5 class="mb-3">Solid Buttons</h5>
    <div class="d-flex flex-wrap gap-2 mb-4">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-success">Success</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-warning">Warning</button>
      <button class="btn btn-info">Info</button>
      <button class="btn btn-light">Light</button>
      <button class="btn btn-dark">Dark</button>
    </div>

    <h5 class="mb-3">Outline Buttons</h5>
    <div class="d-flex flex-wrap gap-2 mb-4">
      <button class="btn btn-outline-primary">Outline Primary</button>
      <button class="btn btn-outline-secondary">Outline Secondary</button>
      <button class="btn btn-outline-success">Outline Success</button>
      <button class="btn btn-outline-danger">Outline Danger</button>
      <button class="btn btn-outline-warning">Outline Warning</button>
      <button class="btn btn-outline-info">Outline Info</button>
      <button class="btn btn-outline-dark">Outline Dark</button>
    </div>

    <h5 class="mb-3">Button Sizes</h5>
    <div class="d-flex flex-wrap align-items-center gap-2">
      <button class="btn btn-primary btn-lg">Large</button>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-sm">Small</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
