<!DOCTYPE html>
<html>
<body>

<input type="number" id="num1" placeholder="Enter first number">
<input type="number" id="num2" placeholder="Enter second number">
<input type="number" id="num3" placeholder="Enter third number">

<button onclick="findGreatest()">Find Greatest</button>

<script>
function findGreatest() {

  let n1 = Number(document.getElementById("num1").value);
  let n2 = Number(document.getElementById("num2").value);
  let n3 = Number(document.getElementById("num3").value);

  let greatest = Math.max(n1, n2, n3);

  alert("Greatest number is: " + greatest);
}
</script>

</body>
</html>
