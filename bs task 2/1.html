<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Tasks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Task 1 -->
<div class="container mt-5 p-4 bg-light">

    <!-- Task 4 Typography -->
    <h1 class="text-center text-primary mb-4">Bootstrap Layout Example</h1>
    <p class="text-center mb-5">This page demonstrates grid, nesting, typography and spacing utilities.</p>

    <!-- Task 2: Responsive 3 Columns -->
    <div class="row">
        
        <div class="col-lg-4 col-12 bg-primary text-white p-3 mb-3">
            Column 1
        </div>

        <div class="col-lg-4 col-12 bg-success text-white p-3 mb-3">
            
            Column 2 (Nested Grid Below)

            <!-- Task 3: Nested Row -->
            <div class="row mt-3">
                <div class="col-6 bg-warning text-dark p-2">
                    Sub Column 1
                </div>
                <div class="col-6 bg-info text-white p-2">
                    Sub Column 2
                </div>
            </div>

        </div>

        <div class="col-lg-4 col-12 bg-danger text-white p-3 mb-3">
            Column 3
        </div>

    </div>

</div>

</body>
</html>
