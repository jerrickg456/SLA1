<!DOCTYPE html>
<html>
<head>
<style>
.container {
    position: relative;
    width: 300px;
    height: 200px;
    background: lightgray;
}

.box1 {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 100px;
    height: 100px;
    background: red;
}

.box2 {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 100px;
    height: 100px;
    background: blue;
}
</style>
</head>
<body>
<div class="container">
    <div class="box1"></div>
</div>
<div class="box2"></div>
</body>
</html>
